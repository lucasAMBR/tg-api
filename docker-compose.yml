services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: local_translator
    user: 0:0
    ports:
      - "5000:5000"
    environment:
      # Essencial para não explodir a memória do seu PC:
      # Baixa apenas os idiomas que você realmente vai usar.
      - LT_LOAD_ONLY=en,pt,es
      # Desativa a necessidade de API Key para uso local
      - LT_REQ_LIMIT=0
      - LT_WORKERS=1
    volumes:
      - libretranslate_data:/home/libretranslate/.local/share/argos-translate
    restart: unless-stopped
    networks:
      - brew-network

  app:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - brew-network
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
  
  db: 
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - brew-network
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: brew_db
      POSTGRES_USER: brew

  redis: 
    image: redis:alpine
    volumes:
      - redisdata:/data
    networks:
      - brew-network
  
networks:
  brew-network:

volumes:
  libretranslate_data:
  pgdata:
  redisdata:
