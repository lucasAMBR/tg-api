; Carregado depois do zz-docker.conf da imagem base, então sobrescreve o que vem dele

[www]
; Só o nginx do próprio container fala com o FPM
listen = 127.0.0.1:9000

; O nginx já registra os acessos
access.log = /dev/null

; Repassa as variáveis de ambiente do Coolify para o PHP (sem isso o FPM limpa o
; ambiente e o Laravel não enxerga nada, já que não existe .env na imagem)
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
